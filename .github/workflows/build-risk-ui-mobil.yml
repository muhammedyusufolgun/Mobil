name: Risk UI Mobile APK
on:
  workflow_dispatch:
  push:
    branches: [risk-ui-mobil]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-risk-ui-mobil.yml'
permissions:
  contents: write
jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Risk-UI-Mobil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Risk-UI-Mobil-APK
          path: Risk-UI-Mobil.apk
          retention-days: 30
      - name: Publish APK to branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release
          cp Risk-UI-Mobil.apk release/Risk-UI-Mobil.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/Risk-UI-Mobil.apk
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Risk UI mobile debug APK [skip ci]'
          git push origin HEAD:risk-ui-mobil
