<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#2f3640;font-family:Segoe UI,Arial,sans-serif}.app{width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px}.panel{width:min(100%,520px);background:white;border-radius:18px;padding:clamp(12px,4vw,24px);box-shadow:0 8px 28px #0001;text-align:center}.settings{background:#f1f2f6;border-radius:12px;padding:12px}h1{font-size:clamp(17px,4.5vw,22px);margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid #dcdde1}.fields{display:flex;gap:8px;justify-content:space-around}.group{min-width:0;flex:1}.group label{display:block;font-size:11px;font-weight:800;margin-bottom:8px}.inputs{display:flex;align-items:center;justify-content:center;gap:2px}input{width:clamp(30px,9vw,48px);min-width:0;text-align:center;border:1px solid #dcdde1;border-radius:6px;padding:8px 1px;font-size:14px;background:white}.status{font-weight:700;color:#718093;margin:16px 0 6px}.timer{position:relative;width:min(72vw,300px);aspect-ratio:1;margin:8px auto 18px}.timer svg{width:100%;height:100%}.track,.thin,.progress{fill:none}.track{stroke:#f1f2f6;stroke-width:16}.thin{stroke:#1dd1a1;stroke-width:3}.progress{stroke:#1dd1a1;stroke-width:16;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s linear}.middle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}#clock{font-size:clamp(33px,9vw,52px);font-weight:750;font-variant-numeric:tabular-nums}#mode{font-size:13px;letter-spacing:1px;font-weight:800;color:#1dd1a1}.controls{display:flex;gap:10px}button{flex:1;min-height:48px;border:0;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer}#start{background:#1dd1a1;color:white}#reset{background:#f1f2f6;color:#566477}.break .thin,.break .progress{stroke:#ff6b6b}.break #mode{color:#ff6b6b}.break #start{background:#ff6b6b}.done .thin,.done .progress{stroke:#ff9f43}.done #mode{color:#ff9f43}.done #start{background:#ff9f43}.credit{margin-top:15px;font-size:11px;color:#a4b0be;font-weight:600}@media(max-width:350px){.panel{padding:9px}.settings{padding:8px}.fields{gap:3px}.group label{font-size:10px}button{font-size:11px}}</style></head><body><main class="app"><section class="panel" id="panel"><div class="settings"><h1>Pomodoro - Zaman Yönetimi</h1><div class="fields"><div class="group"><label>ÇALIŞMA</label><div class="inputs"><input id="h" type="number" min="0" max="99" value="0" aria-label="Saat">:<input id="m" type="number" min="0" max="99" value="25" aria-label="Dakika">:<input id="s" type="number" min="0" max="59" value="0" aria-label="Saniye"></div></div><div class="group"><label>MOLA (DK)</label><div class="inputs"><input id="b" type="number" min="1" max="99" value="5"></div></div><div class="group"><label>DÖNGÜ</label><div class="inputs"><input id="n" type="number" min="1" max="99" value="4"></div></div></div></div><div class="status" id="status">Döngü: 1 / 4</div><div class="timer"><svg viewBox="0 0 300 300"><circle class="track" cx="150" cy="150" r="125"/><circle class="thin" cx="150" cy="150" r="125"/><circle class="progress" id="ring" cx="150" cy="150" r="125"/></svg><div class="middle"><div id="clock">25:00</div><div id="mode">ÇALIŞMA</div></div></div><div class="controls"><button id="start">BAŞLAT</button><button id="reset">UYARLA / SIFIRLA</button></div><div class="credit">Muhammed Yusuf OLGUN</div></section></main><script>
const $=id=>document.getElementById(id),ring=$('ring'),C=2*Math.PI*125;ring.style.strokeDasharray=C;let running=false,work=true,cycle=1,count=4,remaining=1500,total=1500,deadline=0,interval=null,completed=false,workSecs=1500,breakSecs=300;function val(id,min,max){let n=Number($(id).value);return Math.max(min,Math.min(max,Number.isFinite(n)?Math.floor(n):min))}function show(){let t=Math.max(0,remaining),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;$('clock').textContent=(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('status').textContent='Döngü: '+cycle+' / '+count;ring.style.strokeDashoffset=C*(1-t/Math.max(1,total));$('panel').classList.toggle('break',!work&&!completed);$('panel').classList.toggle('done',completed);$('mode').textContent=completed?'TAMAMLANDI!':work?'ÇALIŞMA':'MOLA';$('start').textContent=completed?'YENİDEN BAŞLAT':running?'DURAKLAT':remaining===total?'BAŞLAT':'DEVAM ET'}function alarm(){if(window.Android&&Android.alarm)Android.alarm()}function transition(){alarm();if(work){if(cycle>=count){completed=true;running=false;remaining=0;clearInterval(interval);interval=null;show();return}work=false;total=breakSecs}else{work=true;cycle++;total=workSecs}remaining=total;deadline=Date.now()+remaining*1000;show()}function tick(){if(!running)return;let now=Date.now(),steps=0;while(now>=deadline&&running&&steps++<200){transition();if(completed)return}remaining=Math.max(0,Math.ceil((deadline-now)/1000));show()}function start(){if(completed){apply();return}if(running){running=false;clearInterval(interval);interval=null;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));show();return}if(remaining<=0)remaining=total;running=true;deadline=Date.now()+remaining*1000;interval=setInterval(tick,250);show()}function apply(){running=false;clearInterval(interval);interval=null;workSecs=val('h',0,99)*3600+val('m',0,99)*60+val('s',0,59);breakSecs=val('b',1,99)*60;count=val('n',1,99);if(workSecs<1){workSecs=1;$('s').value=1}work=true;cycle=1;completed=false;total=remaining=workSecs;show()}$('start').onclick=start;$('reset').onclick=apply;document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});apply();
</script></body></html>
