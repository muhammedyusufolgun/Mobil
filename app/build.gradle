plugins { id 'com.android.application' }
android {
  namespace 'tr.olgun.riskui'
  compileSdk 35
  defaultConfig {
    applicationId 'tr.olgun.ltipimatris.mobile'
    minSdk 26
    targetSdk 34
    versionCode 3
    versionName '2.1.0'
  }
  sourceSets {
    main {
      manifest.srcFile 'src/risk/AndroidManifest.xml'
      java.srcDirs = ['src/risk/java']
      res.srcDirs = ['src/risk/res']
      assets.srcDirs = ['src/main/assets']
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
